name: Build AeroForge Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Setup MSVC C++ Environment (link.exe / Windows SDK)
      - name: Setup Visual Studio Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # 3. Setup Rust
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4. Install Frontend & CLI Dependencies
      - name: Install NPM Dependencies
        run: npm install

      # 5. Build the Windows Service
      - name: Build AeroForge Service
        run: npm run service:build

      # 6. Build the Hotkey Helper Binary
      # This generates src-tauri\target\release\aeroforge-hotkey-helper.exe
      - name: Build Hotkey Helper
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin aeroforge-hotkey-helper

      # 7. Ensure target release paths exist and mirror the helper binary
      - name: Ensure Target Directory Structure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/target/release"
          New-Item -ItemType Directory -Force -Path "target/release"
          $helper = Get-ChildItem -Path . -Filter "aeroforge-hotkey-helper.exe" -Recurse | Select-Object -First 1
          if ($helper) {
              Copy-Item $helper.FullName -Destination "src-tauri/target/release/aeroforge-hotkey-helper.exe" -Force
              Copy-Item $helper.FullName -Destination "target/release/aeroforge-hotkey-helper.exe" -Force
              Write-Host "Staged aeroforge-hotkey-helper.exe successfully." -ForegroundColor Green
          }

      # 8. Build Desktop Shell and Bundle Portable & Installer Packages
      - name: Build Desktop App and Portable Bundle
        run: npm run portable:build

      # 9. Upload Portable ZIP & Setup Installer to GitHub Actions Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroForge-v0.16.3-Windows
          path: |
            portable/*.zip
            portable/*.exe
