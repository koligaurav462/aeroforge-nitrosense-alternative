name: Build Full AeroForge (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install Node.js for React/Vite
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Activate Visual Studio C++ Build Tools
      - name: Setup Visual Studio Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # 3. Install Rust (MSVC target)
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4. Install all NPM dependencies
      - name: Install dependencies
        run: npm install 

      # 5. Build the Hotkey Helper FIRST
      # The main Tauri build script requires this .exe to exist before it runs
      - name: Build Hotkey Helper
        working-directory: src-tauri
        run: cargo build --release --bin aeroforge-hotkey-helper

      # 6. Compile the hardware-facing Windows Service
      - name: Build AeroForge Windows Service
        run: npm run service:build

      # 7. Generate the portable package
      - name: Build Portable Version
        run: npm run portable:build

      # 8. Build the Tauri App installers and draft a GitHub Release
      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'AeroForge v__VERSION__'
          releaseBody: 'Automated full build containing the patched React UI, Tauri shell, and Windows Service.'
          releaseDraft: true
          prerelease: false

      # 9. Upload the Portable ZIP to GitHub Actions
      - name: Upload Portable ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroForge-Portable-Build
          path: portable\*.zip
